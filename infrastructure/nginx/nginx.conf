# N01.7 - Kingsmen Oracle Lite Nginx reverse proxy
# Purpose: one-server, low-concurrency, mobile-first proxy for local/Oracle Lite deployment.
# Production remains blocked until TLS/domain/runtime/security proof passes.

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    keepalive_requests 100;
    client_body_timeout 20s;
    client_header_timeout 20s;
    send_timeout 30s;

    client_max_body_size 15m;
    client_body_buffer_size 256k;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    log_format kingsmen_json escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"request_id":"$request_id"'
        '}';

    access_log /var/log/nginx/kingsmen-access.log kingsmen_json;
    error_log /var/log/nginx/kingsmen-error.log warn;

    limit_req_zone $binary_remote_addr zone=kingsmen_public:10m rate=8r/s;
    limit_req_zone $binary_remote_addr zone=kingsmen_api:10m rate=4r/s;
    limit_req_zone $binary_remote_addr zone=kingsmen_auth:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=kingsmen_upload:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=kingsmen_conn:10m;

    upstream kingsmen_web {
        server web:3000 max_fails=3 fail_timeout=15s;
        keepalive 16;
    }

    upstream kingsmen_api {
        server api:4000 max_fails=3 fail_timeout=15s;
        keepalive 16;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        limit_conn kingsmen_conn 20;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Kingsmen-Production-Ready "false" always;
        add_header X-Kingsmen-Deployment-Target "oracle_lite" always;

        location = /health/nginx {
            access_log off;
            default_type application/json;
            return 200 '{"service":"nginx","status":"ok","productionReady":false,"target":"oracle_lite"}';
        }

        location = /health {
            proxy_pass http://kingsmen_api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        location ^~ /api/auth/ {
            limit_req zone=kingsmen_auth burst=5 nodelay;
            proxy_pass http://kingsmen_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location ^~ /api/documents/upload {
            limit_req zone=kingsmen_upload burst=3 nodelay;
            proxy_pass http://kingsmen_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location ^~ /api/ {
            limit_req zone=kingsmen_api burst=20 nodelay;
            proxy_pass http://kingsmen_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location ^~ /_next/static/ {
            proxy_pass http://kingsmen_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache_valid 200 1h;
            expires 1h;
            add_header Cache-Control "public, max-age=3600, immutable" always;
        }

        location / {
            limit_req zone=kingsmen_public burst=30 nodelay;
            proxy_pass http://kingsmen_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
