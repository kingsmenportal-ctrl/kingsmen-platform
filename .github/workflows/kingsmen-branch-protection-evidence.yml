name: Kingsmen Main Branch Protection Evidence

on:
  workflow_dispatch:
  push:
    branches:
      - feat/kingsmen-one-foundation-2026-10-19

permissions:
  contents: read

jobs:
  verify-protection:
    name: verify-main-branch-protection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Explain required read-only credential
        env:
          BRANCH_PROTECTION_READ_TOKEN_CONFIGURED: ${{ secrets.BRANCH_PROTECTION_READ_TOKEN != '' }}
        run: |
          if [ "$BRANCH_PROTECTION_READ_TOKEN_CONFIGURED" != "true" ]; then
            echo "::warning::BRANCH_PROTECTION_READ_TOKEN is not configured; the fallback GITHUB_TOKEN may not have repository administration-read access. Add a fine-grained read-only token with repository administration read permission as BRANCH_PROTECTION_READ_TOKEN."
          fi
      - name: Verify protection using read-only GitHub API
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.BRANCH_PROTECTION_READ_TOKEN || github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: node scripts/ci/capture-main-branch-protection.mjs

      - name: Upload redacted protection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kingsmen-main-branch-protection-${{ github.run_id }}
          path: reports/repo/main-branch-protection-apply-latest.json
          if-no-files-found: error
          retention-days: 14
