name: Kingsmen Main Branch Protection Evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN has repository metadata read by default. The effective-rules
# endpoint uses that permission and supports repository rulesets.
permissions:
  contents: read

jobs:
  verify-protection:
    name: verify-main-branch-protection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Test the stream-level protection policy
        run: node scripts/ci/test-main-branch-protection-policy.mjs

      - name: Verify effective rules for main using GITHUB_TOKEN
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: node scripts/ci/capture-main-branch-protection.mjs

      - name: Upload redacted protection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kingsmen-main-branch-protection-${{ github.run_id }}
          path: reports/repo/main-branch-protection-apply-latest.json
          if-no-files-found: error
          retention-days: 14
