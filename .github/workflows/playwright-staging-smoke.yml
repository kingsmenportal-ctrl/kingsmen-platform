name: Kingsmen Playwright Staging Smoke

on:
  pull_request:
    paths:
      - "scripts/playwright/**"
      - "scripts/staging/test-playwright-staging-smoke.mjs"
      - "scripts/staging/test-n16-*contract.mjs"
      - "scripts/validators/validate-playwright-worker-contract.mjs"
      - "apps/api/src/orchestrator/**"
      - "apps/api/package.json"
      - "apps/api/Dockerfile.playwright-worker"
      - ".dockerignore"
      - "config/environment/.env.template"
      - "db/migrations/202611020001_n16_worker_least_privilege_role.sql"
      - "package.json"
      - "docs/architecture/PLAYWRIGHT_WORKERS_RELEASE_PLAN.md"
      - "render.yaml"
      - ".github/workflows/playwright-staging-smoke.yml"
  push:
    branches:
      - "feat/playwright-workers-controlled-release-2026-11-02"
    paths:
      - "scripts/playwright/**"
      - "scripts/staging/test-playwright-staging-smoke.mjs"
      - "apps/api/src/orchestrator/**"
      - "apps/api/Dockerfile.playwright-worker"
      - "compose.playwright-worker.yml"
      - "render.yaml"
      - "package.json"
      - ".github/workflows/playwright-staging-smoke.yml"
  workflow_dispatch:
    inputs:
      smoke_paths:
        description: 'JSON array of same-origin routes (example: ["/","/pricing"])'
        required: false
        default: '["/"]'
      protected_paths:
        description: 'JSON array of protected routes to probe anonymously (example: ["/portal"])'
        required: false
        default: '[]'
      run_authenticated_isolation:
        description: "Run the read-only Candidate A/B and reviewer access checks using configured staging test identities"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: playwright-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: n16-ci-disposable-only-2026
          POSTGRES_DB: kingsmen_n16_worker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kingsmen_n16_worker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install API runtime and type dependencies
        run: npm --prefix apps/api install --include=dev --no-package-lock
      - name: Compile the N16 worker
        run: npm --prefix apps/api run build
      - name: Validate queue, browser and least-privilege contracts
        run: npm run n16:worker:contract && npm run playwright:contract
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run local browser regression fixture
        run: node scripts/staging/test-playwright-staging-smoke.mjs
      - name: Prove N16 PostgreSQL claim and process-crash recovery in disposable database
        env:
          KINGSMEN_N16_TEST_ALLOW_MUTATION: "true"
          KINGSMEN_N16_TEST_HOST: 127.0.0.1
          KINGSMEN_N16_TEST_PORT: "5432"
          KINGSMEN_N16_TEST_ADMIN_USER: postgres
          KINGSMEN_N16_TEST_DATABASE: kingsmen_n16_worker_test
          PGPASSWORD: n16-ci-disposable-only-2026
          KINGSMEN_N16_TEST_SERVICE_PASSWORD: n16-worker-test-${{ github.run_id }}-${{ github.run_attempt }}-ephemeral
        run: node scripts/staging/test-n16-worker-process-crash-integration.mjs
      - name: Build isolated N16 Playwright worker container
        run: docker build -f apps/api/Dockerfile.playwright-worker -t kingsmen/playwright-worker:ci .
      - name: Verify worker image runs as non-root
        run: test "$(docker image inspect --format '{{.Config.User}}' kingsmen/playwright-worker:ci)" = "pwuser"

  staging-smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run read-only browser smoke checks
        env:
          KINGSMEN_STAGING_BASE_URL: "https://kingsmen-portal-staging.netlify.app"
          KINGSMEN_SMOKE_PATHS: ${{ inputs.smoke_paths || '["/"]' }}
          KINGSMEN_SMOKE_PROTECTED_PATHS: ${{ inputs.protected_paths || '[]' }}
          KINGSMEN_SMOKE_TIMEOUT_MS: "15000"
        run: node scripts/playwright/kingsmen-staging-smoke.mjs

  authenticated-isolation:
    if: github.event_name == 'workflow_dispatch' && inputs.run_authenticated_isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Candidate A/B and reviewer access boundaries
        env:
          KINGSMEN_STAGING_BASE_URL: "https://kingsmen-portal-staging.netlify.app"
          KINGSMEN_SUPABASE_URL: ${{ secrets.KINGSMEN_SUPABASE_URL }}
          KINGSMEN_SUPABASE_ANON_KEY: ${{ secrets.KINGSMEN_SUPABASE_ANON_KEY }}
          KINGSMEN_E2E_CANDIDATE_A_TOKEN: ${{ secrets.KINGSMEN_E2E_CANDIDATE_A_TOKEN }}
          KINGSMEN_E2E_CANDIDATE_B_TOKEN: ${{ secrets.KINGSMEN_E2E_CANDIDATE_B_TOKEN }}
          KINGSMEN_E2E_REVIEWER_TOKEN: ${{ secrets.KINGSMEN_E2E_REVIEWER_TOKEN }}
          KINGSMEN_E2E_CANDIDATE_A_DOCUMENT_ID: ${{ secrets.KINGSMEN_E2E_CANDIDATE_A_DOCUMENT_ID }}
          KINGSMEN_E2E_CANDIDATE_B_DOCUMENT_ID: ${{ secrets.KINGSMEN_E2E_CANDIDATE_B_DOCUMENT_ID }}
        run: node scripts/staging/test-candidate-reviewer-isolation-e2e.mjs
