name: Kingsmen CI

# Emit the two protected branch check contexts on every pull request.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kingsmen-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run focused repository tests
        run: npm test

  build-test:
    name: test-and-build
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm install --prefix apps/api --no-audit --no-fund

      - name: Build API
        run: npm run api:build

      - name: Install web dependencies
        run: npm install --prefix apps/web --no-audit --no-fund

      - name: Build web application
        run: npm run build --prefix apps/web
