name: Kingsmen CI

# One ordinary check for independently releasable streams; includes verified candidate application planning.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kingsmen-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run focused repository tests
        run: npm test
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check candidate Supabase Edge Functions
        run: deno check --node-modules-dir=auto supabase/functions/candidate-master-profile/index.ts supabase/functions/candidate-master-applications/index.ts


      - name: Install API dependencies
        run: npm install --prefix apps/api --no-audit --no-fund

      - name: Build API
        run: npm run api:build

      - name: Install web dependencies
        run: npm ci --prefix apps/web --no-audit --no-fund

      - name: Build web application
        run: npm run build --prefix apps/web
