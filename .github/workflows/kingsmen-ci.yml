name: Kingsmen CI

# One ordinary check for independently releasable streams.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kingsmen-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run focused repository tests
        run: npm test

      - name: Install API dependencies
        run: npm install --prefix apps/api --no-audit --no-fund

      - name: Build API
        run: npm run api:build

      - name: Install web dependencies
        run: npm install --prefix apps/web --no-audit --no-fund

      - name: Build web application
        run: npm run build --prefix apps/web

  # This PR-only job creates a draft/preview deploy on the existing staging site.
  # It deliberately never passes --prod and never changes the primary site URL.
  deploy-staging-preview:
    name: staging-preview
    needs: build-test
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 316
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: fb27d0db-b116-4890-8f7f-14e654c27dbc
      CONTEXT: deploy-preview
      BRANCH: ${{ github.event.pull_request.head.ref }}
      COMMIT_REF: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: |
          npm ci
          npm install --prefix apps/web --no-audit --no-fund

      - name: Build with Netlify's Next.js adapter
        run: npx --yes netlify-cli@latest build --context deploy-preview

      - name: Create draft preview on the staging site
        run: npx --yes netlify-cli@latest deploy --message="Kingsmen frontend PR #316 at ${COMMIT_REF}"

      - name: Record deployment evidence
        if: success()
        run: |
          {
            echo "## Netlify staging preview"
            echo "- Target site ID: ${NETLIFY_SITE_ID}"
            echo "- Source commit: ${COMMIT_REF}"
            echo "- Context: deploy-preview (draft; not published to the primary site)"
            echo "- Deploy output above contains the preview URL and deploy identifier."
          } >> "$GITHUB_STEP_SUMMARY"
