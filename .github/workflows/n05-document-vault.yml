name: N05 Candidate Document Vault

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/src/app/api/candidate/documents/**"
      - "apps/web/src/app/candidate/documents/**"
      - "apps/web/src/lib/candidate-document-runtime.ts"
      - "apps/web/src/app/candidate/outcomes/**"
      - "apps/web/src/app/candidate/saved-opportunities/**"
      - "apps/web/src/components/saved-opportunities-client.tsx"
      - "scripts/validators/validate-n05-document-vault.mjs"
      - "scripts/tests/n05-document-isolation.integration.mjs"
      - "package.json"
      - "apps/web/package.json"
      - ".github/workflows/n05-document-vault.yml"
  push:
    branches:
      - candidate-document-runtime-wiring-2026-10-17
    paths:
      - "apps/web/src/app/api/candidate/documents/**"
      - "apps/web/src/app/candidate/documents/**"
      - "apps/web/src/lib/candidate-document-runtime.ts"
      - "apps/web/src/app/candidate/outcomes/**"
      - "apps/web/src/app/candidate/saved-opportunities/**"
      - "apps/web/src/components/saved-opportunities-client.tsx"
      - "scripts/validators/validate-n05-document-vault.mjs"
      - "package.json"
      - "apps/web/package.json"
      - ".github/workflows/n05-document-vault.yml"

permissions:
  contents: read

jobs:
  static-guards:
    name: N05 source security and lifecycle guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check isolation harness syntax
        run: node --check scripts/tests/n05-document-isolation.integration.mjs
      - name: Run N05 static validation
        run: npm run n05:validate
      - name: Upload N05 validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n05-static-validation-report
          path: reports/n05/n05-document-vault-validation-latest.json
          if-no-files-found: warn

  web-build:
    name: Next.js TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # This repository currently has no committed package-lock.json in apps/web.
      # npm ci requires a lockfile; use npm install until a reviewed lockfile is added.
      - name: Install web dependencies
        run: npm install --no-package-lock --no-audit --no-fund
        working-directory: apps/web
      - name: Build web application
        run: npm run build
        working-directory: apps/web
        env:
          # Build-only placeholders; never used to validate staging connectivity.
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: build-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder-service-role-key
