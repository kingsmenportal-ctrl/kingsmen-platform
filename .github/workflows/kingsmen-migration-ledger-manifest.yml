name: Validate Kingsmen migration ledger manifest

on:
  push:
    branches:
      - rebuild/kingsmen-one-foundation-2026-11-17
    paths:
      - docs/rebuild/KINGSMEN_MIGRATION_LEDGER_RECONCILIATION_2026-11-17.csv
      - scripts/validators/validate-kingsmen-migration-ledger-reconciliation.mjs
      - .github/workflows/kingsmen-migration-ledger-manifest.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-manifest:
    name: Validate audited migration manifest
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate migration reconciliation evidence
        run: node scripts/validators/validate-kingsmen-migration-ledger-reconciliation.mjs
