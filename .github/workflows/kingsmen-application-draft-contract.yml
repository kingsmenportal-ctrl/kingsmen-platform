name: Kingsmen application draft contract

on:
  push:
    branches:
      - rebuild/kingsmen-one-foundation-2026-11-17
    paths:
      - db/migrations/0107_application_capacity_entitlements_20261101.sql
      - db/migrations/0108_candidate_application_readiness_eligibility_deadline_gate_20261101.sql
      - db/migrations/0109_candidate_application_draft_persistence_20261101.sql
      - apps/web/src/app/api/candidate/application-draft/route.ts
      - apps/web/src/app/candidate/applications/[applicationId]/page.tsx
      - apps/web/src/components/candidate/CandidateApplicationTracker.tsx
      - apps/web/src/lib/candidate-session.ts
      - apps/web/src/lib/read-limited-json.ts
      - apps/web/package.json
      - apps/web/package-lock.json
      - scripts/validators/validate-candidate-application-draft-persistence.mjs
      - scripts/staging/fixtures/application-draft-postgres-bootstrap.sql
      - scripts/staging/test-application-draft-postgres.sql
      - scripts/staging/test-candidate-application-draft-ui.mjs
      - .github/workflows/kingsmen-application-draft-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-draft-contract:
    name: Validate draft security contract and PostgreSQL integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-project.supabase.test
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-only-not-a-real-anon-key
    steps:
      - name: Check out rebuild branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies from committed lockfile
        run: npm ci --prefix apps/web
      - name: Validate candidate application draft contract
        run: node scripts/validators/validate-candidate-application-draft-persistence.mjs
      - name: Locate disposable PostgreSQL service container
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 == "postgres:17" { print $1; exit }')"
          if [[ -z "$container_id" ]]; then
            echo "PostgreSQL 17 service container was not found." >&2
            exit 1
          fi
          echo "KINGSMEN_POSTGRES_CONTAINER_ID=$container_id" >> "$GITHUB_ENV"
      - name: Bootstrap isolated PostgreSQL draft fixture
        run: docker exec -i "$KINGSMEN_POSTGRES_CONTAINER_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/staging/fixtures/application-draft-postgres-bootstrap.sql
      - name: Apply draft-persistence migration to disposable PostgreSQL
        run: docker exec -i "$KINGSMEN_POSTGRES_CONTAINER_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < db/migrations/0109_candidate_application_draft_persistence_20261101.sql
      - name: Test draft save, idempotency, consent and candidate isolation
        run: docker exec -i "$KINGSMEN_POSTGRES_CONTAINER_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/staging/test-application-draft-postgres.sql
      - name: Build Next.js application with CI-only Supabase config
        run: npm --prefix apps/web run build
      - name: Install Chromium for browser smoke tests
        run: apps/web/node_modules/.bin/playwright install chromium
      - name: Test candidate draft browser save and resume
        run: node scripts/staging/test-candidate-application-draft-ui.mjs
