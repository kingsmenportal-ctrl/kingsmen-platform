name: Web CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "db/migrations/**"
      - "netlify.toml"
      - ".github/workflows/web-build-and-lock.yml"
  push:
    branches:
      - "auth-identity-profile-batch-*"
    paths:
      - "apps/web/**"
      - "db/migrations/**"
      - "netlify.toml"
      - ".github/workflows/web-build-and-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile-presence:
    name: Lockfile presence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify package manifests exist
        run: |
          set -euo pipefail
          test -s apps/web/package.json
          test -s apps/web/package-lock.json
          echo "package.json and committed package-lock.json are present."

  migration-integrity:
    name: Migration 0059–0071 presence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify each migration exists exactly once
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            0059_candidate_identity_link_requests.sql \
            0060_atomic_marketplace_review.sql \
            0061_candidate_identity_review_workflow.sql \
            0062_candidate_registration_identity_request.sql \
            0063_atomic_payfast_itn_reconciliation.sql \
            0064_payfast_intent_order_invoice_atomic.sql \
            0065_founder_finance_exception_review.sql \
            0066_founder_operations_notification_queue.sql \
            0067_founder_control_plane_approval_actions.sql \
            0068_candidate_portal_messages.sql \
            0069_founder_profile_change_review.sql \
            0070_candidate_refund_requests.sql \
            0071_founder_candidate_portal_messaging.sql; do
            path="db/migrations/$file"
            if [ ! -f "$path" ]; then
              echo "::error::Missing migration: $path"
              exit 1
            fi
            echo "Found $path"
          done

  web-build:
    name: Install, type-check, and production build
    needs:
      - lockfile-presence
      - migration-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install exact locked dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Type-check web app
        working-directory: apps/web
        run: npm run typecheck
      - name: Build production web bundle
        working-directory: apps/web
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: ci-public-anon-placeholder
        run: npm run build
