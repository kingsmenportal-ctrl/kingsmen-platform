name: Web Build and Lockfile

on:
  push:
    branches:
      - "auth-identity-profile-batch-*"
    paths:
      - "apps/web/**"
      - "netlify.toml"
      - ".github/workflows/web-build-and-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Install, typecheck, and build web app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate deterministic dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile when missing or changed
        working-directory: .
        run: |
          if ! git ls-files --error-unmatch apps/web/package-lock.json >/dev/null 2>&1 || ! git diff --quiet -- apps/web/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/package-lock.json
            git commit -m "build(web): lock npm dependency graph"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          git config --unset-all http.https://github.com/.extraheader || true

      - name: Install exactly from lockfile
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build
