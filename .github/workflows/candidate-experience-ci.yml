name: Candidate Experience CI

on:
  push:
    branches: [feat/candidate-experience-closeout-2026-10-30, capacity/0098-active-candidate-cap-2026-10-30, feat/rc1-ui-quality-current-security-2026-10-30, ops/backup-restore-safety-current-rc-2026-10-30, fix/0096-cao-provenance-adoption-rc1-reconciled-2026-10-31, feat/cross-sector-institution-source-coverage-2026-10-31, feat/candidate-cross-sector-directory-2026-10-31, feat/institution-readiness-current-stack-2026-10-31, feat/institution-application-readiness-engine-2026-10-31, feat/national-institution-usability-2026-10-31]
  pull_request:
    branches: [main, feat/backend-simplification-baseline-2026-10-29, security/0097-port-on-candidate-rc1-2026-10-30, capacity/0098-active-candidate-cap-2026-10-30, feat/rc1-ui-quality-current-security-2026-10-30, ops/backup-restore-safety-current-rc-2026-10-30, feat/cross-sector-institution-source-coverage-2026-10-31, feat/national-institution-network-source-coverage-2026-10-31, feat/candidate-cross-sector-directory-2026-10-31, feat/institution-application-readiness-engine-2026-10-31, feat/national-institution-usability-2026-10-31]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-experience:
    name: candidate-experience-build-and-contract
    runs-on: ubuntu-24.04 # Playwright Chromium binaries require the supported Ubuntu 24.04 runner image
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install repository dependencies
        run: npm ci
      - name: Install API dependencies
        run: npm install --prefix apps/api --no-audit --no-fund
      - name: Install web dependencies
        run: npm install --prefix apps/web --no-audit --no-fund
      - name: Full repository regression suite
        run: npm test
      - name: Candidate Experience source-contract regression
        run: npm run candidate:experience:check
      - name: Build backend API
        run: npm run api:build
      - name: Build Next.js web application
        run: npm --prefix apps/web run build
      - name: Install Chromium for RC1 browser smoke tests
        run: npx --prefix apps/web playwright install --with-deps chromium
      - name: Start the production Next.js server
        run: |
          npm --prefix apps/web run start -- --port 3000 > /tmp/kingsmen-next.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/kingsmen-next.log
          exit 1
      - name: RC1 responsive, accessibility-smoke and screenshot capture
        run: npm --prefix apps/web run ui:rc1:smoke
        env:
          KINGSMEN_UI_BASE_URL: http://127.0.0.1:3000
          KINGSMEN_UI_ARTIFACT_DIR: ../../artifacts/ui-rc1
      - name: Upload RC1 browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kingsmen-rc1-ui-smoke
          path: artifacts/ui-rc1/
          if-no-files-found: warn

  dhet-private-registers:
    name: dhet-private-register-extraction
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      - name: Download official DHET register snapshots
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 180 'https://www.dhet.gov.za/Registers_DocLib/Annexure%20A%20Register%20%20Private%20Higher%20Education%20Institutions%2006%20July%202026.pdf' --output /tmp/dhet-hei.pdf
          curl --fail --location --retry 3 --max-time 180 'https://www.dhet.gov.za/Registers_DocLib/Register%20of%20Private%20Colleges%20%2015%20July%202026.pdf' --output /tmp/dhet-colleges.pdf
          pdfinfo /tmp/dhet-hei.pdf | grep -E 'Pages: *210'
          pdfinfo /tmp/dhet-colleges.pdf | grep -E 'Pages: *92'
          pdftotext -layout /tmp/dhet-hei.pdf /tmp/dhet-hei.txt
          pdftotext -layout /tmp/dhet-colleges.pdf /tmp/dhet-colleges.txt
      - name: Extract registry candidates
        run: |
          mkdir -p artifacts/dhet-private-registers
          node scripts/institutions/extract-dhet-private-registers.mjs --higher-education-text /tmp/dhet-hei.txt --private-colleges-text /tmp/dhet-colleges.txt --out artifacts/dhet-private-registers/candidates.json
          node -e "const m=require('./artifacts/dhet-private-registers/candidates.json'); console.log(JSON.stringify({schema:m.schema,status:m.status,counts:m.counts},null,2));"
      - name: Validate extracted records and route safety
        run: node scripts/validators/validate-dhet-private-register-manifest.mjs artifacts/dhet-private-registers/candidates.json
      - name: Upload full-register candidate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dhet-private-register-candidates
          path: artifacts/dhet-private-registers/
          if-no-files-found: warn
