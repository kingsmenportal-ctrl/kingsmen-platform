name: Candidate Identity Review Build

on:
  pull_request:
    paths:
      - "db/migrations/0075_candidate_identity_review_requests.sql"
      - "db/migrations/0076_candidate_identity_review_decision_workflow.sql"
      - "apps/web/src/app/api/candidate/identity-review/**"
      - "apps/web/src/app/api/reviewer/identity-review/**"
      - "apps/web/src/app/candidate/identity-review/**"
      - "apps/web/src/app/reviewer/identity-requests/**"
      - "scripts/validators/validate-candidate-identity-review-intake.mjs"
      - "scripts/tests/test-candidate-identity-review-api.mjs"
      - ".github/workflows/candidate-identity-review-build.yml"
  push:
    branches:
      - "feat/candidate-identity-review-lifecycle"
    paths:
      - "db/migrations/0075_candidate_identity_review_requests.sql"
      - "db/migrations/0076_candidate_identity_review_decision_workflow.sql"
      - "apps/web/src/app/api/candidate/identity-review/**"
      - "apps/web/src/app/api/reviewer/identity-review/**"
      - "apps/web/src/app/candidate/identity-review/**"
      - "apps/web/src/app/reviewer/identity-requests/**"
      - "scripts/validators/validate-candidate-identity-review-intake.mjs"
      - ".github/workflows/candidate-identity-review-build.yml"

permissions:
  contents: read

jobs:
  identity-review-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Validate identity review security contract
        run: node scripts/validators/validate-candidate-identity-review-intake.mjs
      - name: Run identity review API integration tests
        run: node scripts/tests/test-candidate-identity-review-api.mjs
      - name: Install web dependencies
        run: npm install --prefix apps/web --no-audit --no-fund
      - name: Build Next.js web application
        run: npm --prefix apps/web run build
