name: Kingsmen Source Guard

on:
  pull_request:
    branches: [main, feat/release-engineering-evidence-pipeline]
  push:
    branches: [main, feat/staging-authenticated-e2e-gate]
  workflow_dispatch:

jobs:
  source-guard:
    name: source-guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: FK index hardening migration source contract
        run: npm run db:validate:fk-index-hardening

      - name: Private review table access contract
        run: npm run security:validate:review-tables

      - name: Main branch protection evidence capture source contract
        run: npm run repo:validate:branch-protection-capture

      - name: Authenticated staging E2E runner source contract
        run: npm run staging:e2e:validate

      - name: Authenticated staging E2E runner regression tests
        run: npm run staging:e2e:test

      - name: API Truth Vault persistence validator
        run: npm run api:validate:truth-vault

      - name: Safe web/backend boundary validator
        run: npm run web:validate:backend-boundary

      - name: PayFast sandbox source proof
        run: npm run payments:prove:sandbox

      - name: PayFast sandbox validator
        run: npm run payments:validate:sandbox

      - name: RLS/security source proof
        run: npm run security:prove:rls

      - name: RLS/security validator
        run: npm run security:validate:rls

      - name: Backup/restore source proof
        run: npm run backup:prove:restore

      - name: Backup/restore validator
        run: npm run backup:validate:restore

      - name: Secrets wiring source proof
        run: npm run secrets:prove:wiring

      - name: Secrets wiring validator
        run: npm run secrets:validate:wiring

      - name: Communications source proof
        run: npm run communications:prove

      - name: Communications validator
        run: npm run communications:validate

      - name: Observability source proof
        run: npm run observability:prove

      - name: Observability validator
        run: npm run observability:validate

      - name: Legal/privacy source proof
        run: npm run legal:prove

      - name: Legal/privacy validator
        run: npm run legal:validate

      - name: Staging pack source proof
        run: npm run staging:prove:pack

      - name: Staging pack validator
        run: npm run staging:validate:pack

      - name: Staging evidence capture source proof
        run: npm run staging:prove:capture

      - name: Staging evidence capture validator
        run: npm run staging:validate:capture

      - name: Final assembly evidence source proof
        run: npm run final:prove:evidence

      - name: Final assembly evidence validator
        run: npm run final:validate:evidence

      - name: Branch protection source proof
        run: npm run repo:prove:branch-protection

      - name: Branch protection validator
        run: npm run repo:validate:branch-protection

      - name: Repository-wide module and launch inventory
        run: npm run kingsmen:inventory:verify

      - name: Launch audit report
        run: npm run kingsmen:launch:audit
