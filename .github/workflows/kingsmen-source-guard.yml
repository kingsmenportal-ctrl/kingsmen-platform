name: Kingsmen Source Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-guard:
    name: source-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Run web finance-ledger contract regression tests
        run: node --test apps/web/test/*.test.cjs

      - name: Install root dependencies
        run: npm ci

      - name: Run core regression validators
        run: npm test

      - name: API persistence source validator
        run: npm run api:validate

      - name: Safe web/backend boundary validator
        run: npm run web:validate:backend-boundary

      - name: Install API dependencies
        run: npm install --prefix apps/api --ignore-scripts

      - name: Build API
        run: npm run api:build

      - name: Run API runtime smoke tests
        run: npm --prefix apps/api test

      - name: Produce launch-readiness audit
        run: npm run kingsmen:launch:audit

      - name: Credential-free source foundation checks
        run: node scripts/validators/validate-credential-free-foundation.mjs

      - name: Enforce launch-readiness gate
        run: npm run kingsmen:launch:gate

      - name: Preserve validation and launch-gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kingsmen-source-guard-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            reports/validation/**
            reports/launch/**
            reports/staging/**
            reports/security/**
            reports/repo/**
