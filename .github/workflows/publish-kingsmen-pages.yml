          if "textContent" not in html:
              raise SystemExit("Provider readiness checklist must render user content as text")
          print("Provider Connection Readiness contract passed: local-only checklist, safe text rendering, independent provider evidence states and no network submission.")
          PY
          echo "Public artifact contains only the approved public pages and supporting files."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload isolated public artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

      - name: Deploy public website
        id: deployment
        uses: actions/deploy-pages@v4
