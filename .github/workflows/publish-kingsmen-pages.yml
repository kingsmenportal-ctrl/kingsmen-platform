name: Publish Kingsmen public information site
# This dedicated branch contains public HTML/CSS only; application source stays on the product branches.

on:
  push:
    branches:
      - pages-temp-static
    paths:
      - "index.html"
      - "opportunities.html"
      - "funding.html"
      - "funding-readiness.html"
      - "selection-readiness.html"
      - "requirements-evidence.html"
      - "application-cost-planner.html"
      - "programme-choice-planner.html"
      - "application-guide.html"
      - "employment-cv.html"
      - "accommodation.html"
      - "verification-safety.html"
      - "application-follow-up.html"
      - "opportunity-source-register.html"
      - "opportunity-comparison.html"
      - "payment-readiness.html"
      - "case-resolution-planner.html"
      - "provider-connection-readiness.html"
      - "about.html"
      - "help.html"
      - "404.html"
      - "site.css"
      - ".github/workflows/publish-kingsmen-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kingsmen-public-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out public information source
        uses: actions/checkout@v4

      - name: Assemble an isolated public-only site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site-dist
          cp index.html opportunities.html funding.html funding-readiness.html selection-readiness.html requirements-evidence.html application-cost-planner.html programme-choice-planner.html application-guide.html employment-cv.html accommodation.html verification-safety.html application-follow-up.html opportunity-source-register.html opportunity-comparison.html payment-readiness.html case-resolution-planner.html provider-connection-readiness.html about.html help.html 404.html site.css site-dist/
          sed -i 's/Not on this temporary public website\./Not on this public information website./g' site-dist/help.html
          sed -i 's/This temporary Kingsmen website only contains published static pages\./This Kingsmen public website contains published information pages./g' site-dist/404.html
          python3 - <<'PY'
          from pathlib import Path
          base = "https://kingsmenportal-ctrl.github.io/kingsmen-platform/"
          for page in ("index.html", "opportunities.html", "funding.html", "funding-readiness.html", "selection-readiness.html", "requirements-evidence.html", "application-cost-planner.html", "programme-choice-planner.html", "application-guide.html", "employment-cv.html", "accommodation.html", "verification-safety.html", "application-follow-up.html", "opportunity-source-register.html", "opportunity-comparison.html", "payment-readiness.html", "case-resolution-planner.html", "provider-connection-readiness.html", "about.html", "help.html"):
              path = Path("site-dist") / page
              html = path.read_text(encoding="utf-8")
              canonical = base + ("" if page == "index.html" else page)
              html = html.replace("</head>", f'<link rel="canonical" href="{canonical}"></head>', 1)
              path.write_text(html, encoding="utf-8")
          PY
          cat > site-dist/robots.txt <<'EOF'
          User-agent: *
          Allow: /
          Sitemap: https://kingsmenportal-ctrl.github.io/kingsmen-platform/sitemap.xml
          EOF
          cat > site-dist/sitemap.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url><loc>https://kingsmenportal-ctrl.github.io/kingsmen-platform/</loc></url>
            <url><loc>https://kingsmenportal-ctrl.github.io/kingsmen-platform/opportunities.html</loc></url>
            <url><loc>https://kingsmenportal-ctrl.github.io/kingsmen-platform/funding.html</loc></url>
            <url><loc>https://kingsmenportal-ctrl.github.io/kingsmen-platform/funding-readiness.html</loc></url>
            <url><loc>https://kingsmenportal-ctrl.github.io/kingsmen-platform/selection-readiness.html</loc></url>
            <url><loc>https://kingsmenportal-ctrl.github.io/kingsmen-platform/requirements-evidence.html</loc></url>
            <url><loc>https://kingsmenportal-ctrl.github.io/kingsmen-platform/application-cost-planner.html</loc></url>
            <url><loc>https://kingsmenportal-ctrl.github.io/kingsmen-platform/programme-choice-planner.html</loc></url>
            <url><loc>https://kingsmenportal-ctrl.github.io/kingsmen-platform/application-guide.html</loc></url>
            <url><loc>https://kingsmenportal-ctrl.github.io/kingsmen-platform/employment-cv.html</loc></url>
            <url><loc>https://kingsmenportal-ctrl.github.io/kingsmen-platform/accommodation.html</loc></url>
            <url><loc>https://kingsmenportal-ctrl.github.io/kingsmen-platform/verification-safety.html</loc></url>
            <url><loc>https://kingsmenportal-ctrl.github.io/kingsmen-platform/application-follow-up.html</loc></url>
            <url><loc>https://kingsmenportal-ctrl.github.io/kingsmen-platform/opportunity-source-register.html</loc></url>
            <url><loc>https://kingsmenportal-ctrl.github.io/kingsmen-platform/opportunity-comparison.html</loc></url>
            <url><loc>https://kingsmenportal-ctrl.github.io/kingsmen-platform/payment-readiness.html</loc></url>
            <url><loc>https://kingsmenportal-ctrl.github.io/kingsmen-platform/case-resolution-planner.html</loc></url>
            <url><loc>https://kingsmenportal-ctrl.github.io/kingsmen-platform/provider-connection-readiness.html</loc></url>
            <url><loc>https://kingsmenportal-ctrl.github.io/kingsmen-platform/about.html</loc></url>
            <url><loc>https://kingsmenportal-ctrl.github.io/kingsmen-platform/help.html</loc></url>
          </urlset>
          EOF
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("site-dist/sitemap.xml")
          print("Sitemap XML is well-formed.")
          PY
          touch site-dist/.nojekyll
          test -s site-dist/index.html
          test -s site-dist/site.css
          for page in opportunities.html funding.html funding-readiness.html selection-readiness.html requirements-evidence.html application-cost-planner.html programme-choice-planner.html application-guide.html employment-cv.html accommodation.html verification-safety.html application-follow-up.html opportunity-source-register.html opportunity-comparison.html payment-readiness.html case-resolution-planner.html provider-connection-readiness.html about.html help.html 404.html; do test -s "site-dist/$page"; done
          python3 - <<'PY'
          from pathlib import Path
          html = (Path("site-dist") / "application-guide.html").read_text(encoding="utf-8")
          required = ("kingsmen.application-guide.checklist.v1", "localStorage.setItem", "localStorage.removeItem", "aria-live=\"polite\"", "not sent to Kingsmen")
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f"Application Preparation contract failed; missing: {missing}")
          if "fetch(" in html or "XMLHttpRequest" in html:
              raise SystemExit("Application Preparation must not transmit checklist data to a server")
          print("Application Preparation contract passed: device-local persistence, reset and no network submission.")
          PY
          python3 - <<'PY'
          from pathlib import Path
          html = (Path("site-dist") / "employment-cv.html").read_text(encoding="utf-8")
          required = ("kingsmen.employment-cv.checklist.v1", "localStorage.setItem", "localStorage.removeItem", 'aria-live="polite"', "not sent to Kingsmen")
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f"Employment & CV Readiness contract failed; missing: {missing}")
          if "fetch(" in html or "XMLHttpRequest" in html:
              raise SystemExit("Employment & CV checklist must not transmit checklist data to a server")
          print("Employment & CV Readiness contract passed: device-local checklist, reset and no network submission.")
          PY
          python3 - <<'PY'
          from pathlib import Path
          html = (Path("site-dist") / "accommodation.html").read_text(encoding="utf-8")
          required = ("kingsmen.accommodation.checklist.v1", "localStorage.setItem", "localStorage.removeItem", 'aria-live="polite"', "not sent to Kingsmen")
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f"Accommodation Readiness contract failed; missing: {missing}")
          if "fetch(" in html or "XMLHttpRequest" in html:
              raise SystemExit("Accommodation checklist must not transmit checklist data to a server")
          print("Accommodation Readiness contract passed: device-local checklist, reset and no network submission.")
          PY
          python3 - <<'PY'
          from pathlib import Path
          html = (Path("site-dist") / "verification-safety.html").read_text(encoding="utf-8")
          required = ("kingsmen.verification-safety.checklist.v1", "localStorage.setItem", "localStorage.removeItem", 'aria-live="polite"', "not sent to Kingsmen", "directory entry is a starting point", "not proof that a programme is open")
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f"Opportunity Verification & Scam Safety contract failed; missing: {missing}")
          if "fetch(" in html or "XMLHttpRequest" in html:
              raise SystemExit("Verification checklist must not transmit checklist data to a server")
          print("Opportunity Verification & Scam Safety contract passed: local-only checklist, reset, privacy boundary and no false verification claim.")
          PY
          python3 - <<'PY'
          from pathlib import Path
          html = (Path("site-dist") / "application-follow-up.html").read_text(encoding="utf-8")
          required = ("kingsmen.application-follow-up-planner.v1", "localStorage.setItem", "localStorage.removeItem", 'aria-live="polite"', "not sent to Kingsmen", "Candidate-reported submission — not provider-confirmed", "Provider-confirmed receipt", "Provider decision received", "full platform must persist records server-side")
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f"Application Follow-up Planner contract failed; missing: {missing}")
          if "fetch(" in html or "XMLHttpRequest" in html:
              raise SystemExit("Follow-up planner must not transmit entries to a server")
          print("Application Follow-up Planner contract passed: local-only storage, explicit evidence states and no server submission.")
          PY
          python3 - <<'PY'
          from pathlib import Path
          html = (Path("site-dist") / "opportunity-source-register.html").read_text(encoding="utf-8")
          required = ("kingsmen.opportunity-source-register.v1", "localStorage.setItem", "localStorage.removeItem", 'aria-live="polite"', "not sent to Kingsmen", "Source located", "Provider-confirmed receipt", "not the live Kingsmen provider database")
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f"Opportunity Source Register contract failed; missing: {missing}")
          if "fetch(" in html or "XMLHttpRequest" in html:
              raise SystemExit("Source register must not transmit local records to a server")
          print("Opportunity Source Register contract passed: local-only storage, explicit evidence states and no server submission.")
          PY
          python3 - <<'PY'
          from pathlib import Path
          html = (Path("site-dist") / "opportunity-comparison.html").read_text(encoding="utf-8")
          required = ("kingsmen.opportunity-comparison-planner.v1", "localStorage.setItem", "localStorage.removeItem", 'aria-live="polite"', "No information was sent to Kingsmen", "Compare up to four", "not synchronised with Kingsmen", "provider-confirmed receipt")
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f"Opportunity Comparison Planner contract failed; missing: {missing}")
          if "fetch(" in html or "XMLHttpRequest" in html:
              raise SystemExit("Comparison planner must not transmit local entries to a server")
          print("Opportunity Comparison Planner contract passed: local-only persistence, four-option limit, evidence distinctions and no server submission.")
          PY
          python3 - <<'PY'
          from pathlib import Path
          html = (Path("site-dist") / "funding-readiness.html").read_text(encoding="utf-8")
          required = ("kingsmen.funding-application-readiness.v1", "localStorage.setItem", "localStorage.removeItem", 'aria-live="polite"', "No information was sent to Kingsmen", "candidate-reported submission", "not Kingsmen's authenticated funding workflow")
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f"Funding Application Readiness contract failed; missing: {missing}")
          if "fetch(" in html or "XMLHttpRequest" in html:
              raise SystemExit("Funding readiness checklist must not transmit local records to a server")
          print("Funding Application Readiness contract passed: device-local persistence, evidence-state distinctions and no server submission.")
          PY
          python3 - <<'PY'
          from pathlib import Path
          html = (Path("site-dist") / "selection-readiness.html").read_text(encoding="utf-8")
          required = ("kingsmen.selection-assessment-readiness.v1", "localStorage.setItem", "localStorage.removeItem", 'aria-live="polite"', "No information was sent to Kingsmen", "Candidate-reported invitation — not provider-confirmed", "Provider-confirmed invitation", "not a calendar, reminder service, application tracker or private document vault")
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f"Selection & Assessment Readiness contract failed; missing: {missing}")
          if "fetch(" in html or "XMLHttpRequest" in html:
              raise SystemExit("Selection readiness plans must not transmit local records to a server")
          if "localStorage.setItem" not in html or "localStorage.removeItem" not in html:
              raise SystemExit("Selection readiness must support local persistence and clear-all")
          print("Selection & Assessment Readiness contract passed: device-local persistence, evidence-state distinctions, safe HTTPS source validation and no server submission.")
          PY
          python3 - <<'PY'
          from pathlib import Path
          html = (Path("site-dist") / "requirements-evidence.html").read_text(encoding="utf-8")
          required = ("kingsmen.requirements-evidence-planner.v1", "localStorage.setItem", "localStorage.removeItem", 'aria-live="polite"', "No information was sent to Kingsmen", "Candidate-reported ready — not provider-verified", "Candidate-reported submitted — not provider-confirmed", "Provider-confirmed received / accepted", "u.protocol!=='https:'", "not Kingsmen's authenticated application workflow or Document Vault")
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f"Requirements & Evidence Planner contract failed; missing: {missing}")
          if "fetch(" in html or "XMLHttpRequest" in html:
              raise SystemExit("Requirements planner must not transmit local records to a server")
          if "innerHTML" in html:
              raise SystemExit("Requirements planner must render candidate text without innerHTML")
          print("Requirements & Evidence Planner contract passed: local persistence/deletion, HTTPS-only sources, safe text rendering, explicit evidence distinctions and no network submission.")
          PY
          python3 - <<'PY'
          from pathlib import Path
          html = (Path("site-dist") / "application-cost-planner.html").read_text(encoding="utf-8")
          required = ("kingsmen.application-cost-logistics.v1", "localStorage.setItem", "localStorage.removeItem", 'aria-live="polite"', "No payment was made", "Intl.NumberFormat", "currency:'ZAR'", "Candidate estimate — not provider-confirmed", "Provider-confirmed amount / written quote", "Number.isFinite", "u.protocol!=='https:'", "not Kingsmen Finance, PayFast checkout")
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f"Application Cost & Logistics Planner contract failed; missing: {missing}")
          if "fetch(" in html or "XMLHttpRequest" in html:
              raise SystemExit("Cost planner must not transmit local records or payment data to a server")
          if "innerHTML" in html:
              raise SystemExit("Cost planner must render candidate text without innerHTML")
          print("Application Cost & Logistics Planner contract passed: local persistence/deletion, ZAR totals, estimate/provider amount distinction, numeric validation, HTTPS source validation and no payment/network submission.")
          PY
          python3 - <<'PY'
          from pathlib import Path
          html = (Path("site-dist") / "programme-choice-planner.html").read_text(encoding="utf-8")
          required = ("kingsmen.programme-choice-planner.v1", "localStorage.setItem", "localStorage.removeItem", 'aria-live="polite"', "choices:[]", "parent.choices.length>=6", "parent.choices.some(x=>x.rank===rank)", "parent.choices.push(choice)", "Candidate-reported submission — not provider-confirmed", "Provider-confirmed receipt", "u.protocol!=='https:'", "not the authenticated Kingsmen master application or CAO integration")
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f"Programme Choice Planner contract failed; missing: {missing}")
          if "fetch(" in html or "XMLHttpRequest" in html:
              raise SystemExit("Programme choice plans must not transmit local records to a server")
          if "innerHTML" in html:
              raise SystemExit("Programme choice planner must render candidate text without innerHTML")
          print("Programme Choice Planner contract passed: parent/child structure, six-choice limit, unique ranks, local persistence/deletion, HTTPS sources, evidence distinctions and no server submission.")
          PY
          python3 - <<'PY'
          from pathlib import Path
          html = (Path("site-dist") / "payment-readiness.html").read_text(encoding="utf-8")
          required = ("kingsmen.payment-safety-readiness.v1", "localStorage.setItem", "localStorage.removeItem", 'aria-live="polite"', "not sent to Kingsmen", "candidate-reported payment", "Provider confirmation validated", "does not take payments", "banking secrets")
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f"Payment Safety & Receipt Readiness contract failed; missing: {missing}")
          if "fetch(" in html or "XMLHttpRequest" in html:
              raise SystemExit("Payment readiness checklist must not transmit local data or payment information")
          if "innerHTML" in html:
              raise SystemExit("Payment readiness checklist must render text without innerHTML")
          print("Payment Safety & Receipt Readiness contract passed: device-local persistence/reset, evidence distinctions, financial-secret warning and no server submission.")
          PY
          python3 - <<'PY'
          from pathlib import Path
          html = (Path("site-dist") / "case-resolution-planner.html").read_text(encoding="utf-8")
          required = ("kingsmen.case-resolution-planner.v1", "localStorage.setItem", "localStorage.removeItem", 'aria-live="polite"', "Candidate reports submitted — not provider-confirmed", "Provider acknowledgement recorded by candidate", "not independently verified", "u.protocol!=='https:'", "Not sent to a provider or Kingsmen")
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f"Case Resolution & Escalation Planner contract failed; missing: {missing}")
          for forbidden in ("fetch(", "XMLHttpRequest", "innerHTML"):
              if forbidden in html:
                  raise SystemExit(f"Case planner must not use {forbidden}")
          if "textContent" not in html or "replaceChildren" not in html:
              raise SystemExit("Case planner must render user content as text, not HTML")
          print("Case Resolution & Escalation Planner contract passed: local-only persistence/deletion, HTTPS-only URLs, candidate/provider evidence distinction, safe text rendering and no network submission.")
          PY
          python3 - <<'PY'
          from pathlib import Path
          html = (Path("site-dist") / "provider-connection-readiness.html").read_text(encoding="utf-8")
          required = ("kingsmen.provider-connection-readiness.v1", "localStorage.setItem", "localStorage.removeItem", 'aria-live="polite"', "not sent to Kingsmen", "Directory reference identified", "Legal entity verified", "Provider-authorised route", "Integration connection tested", "Provider-confirmed receipt", "Current opportunity status is separate", "founder approval")
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f"Provider Connection Readiness contract failed; missing: {missing}")
          for forbidden in ("fetch(", "XMLHttpRequest", "innerHTML"):
              if forbidden in html:
