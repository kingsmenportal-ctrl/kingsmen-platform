name: Active Candidate Capacity

on:
  pull_request:
    branches: [feat/rc1-product-coherence-qa-2026-10-30-v2]
  push:
    branches: [feat/rc1-product-coherence-qa-2026-10-30-v2, feat/rc1-operations-hardening-2026-10-30]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-candidate-capacity:
    name: PostgreSQL 17 active-candidate admission and concurrency tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: kingsmen_capacity_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kingsmen_capacity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install API dependencies
        run: npm install --prefix apps/api --no-audit --no-fund
      - name: Test isolated PostgreSQL capacity guard
        run: node scripts/staging/test-active-candidate-capacity.mjs
        env:
          KINGSMEN_CAPACITY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kingsmen_capacity_test
          KINGSMEN_CAPACITY_TEST_ALLOW_MUTATION: "true"
