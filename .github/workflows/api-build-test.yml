name: Kingsmen API Build and Smoke Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "scripts/validators/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/api-build-test.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "scripts/validators/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/api-build-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-build-and-smoke:
    name: API build and runtime smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install repository tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install API dependencies
        run: npm install --prefix apps/api --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Build API and run runtime smoke tests
        run: npm --prefix apps/api test

      - name: Run repository validator suite
        run: npm test

