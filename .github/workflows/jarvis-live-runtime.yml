name: Jarvis Live Runtime

on:
  pull_request:
    paths:
      - '.github/workflows/jarvis-live-runtime.yml'
      - 'packages/jarvis-core/**'
      - 'apps/api/src/jarvis/**'
      - 'apps/web/src/app/api/jarvis/**'
      - 'apps/web/src/app/admin/jarvis-*/**'
      - 'scripts/jarvis/**'
      - 'scripts/validators/validate-jarvis-*.mjs'
      - 'supabase/functions/payfast-sandbox/**'
      - 'supabase/migrations/*payfast*.sql'
      - 'scripts/staging/test-payfast-atomic-checkout-contract.mjs'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
    paths:
      - 'packages/jarvis-core/**'
      - 'apps/api/src/jarvis/**'
      - 'apps/web/src/app/api/jarvis/**'
      - 'apps/web/src/app/admin/jarvis-*/**'
      - 'scripts/jarvis/**'
      - 'scripts/validators/validate-jarvis-*.mjs'
      - 'package.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Jarvis core
        run: node scripts/validators/validate-jarvis-core.mjs

      - name: Validate Jarvis runtime controller
        run: node scripts/validators/validate-jarvis-runtime-controller.mjs

      - name: Validate Jarvis live batch
        run: node scripts/validators/validate-jarvis-complete-live-batch.mjs

      - name: Install locked dependencies for PayFast contract test
        run: npm ci

      - name: Validate PayFast checkout and settlement contract
        run: npm run payments:test:atomic-checkout
